# ============================================================================
# Alerts
# ============================================================================
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 80
  - rule: MEM_UTILIZATION
    value: 80

# ============================================================================
# Cost Breakdown (Monthly)
# ============================================================================
# Backend service (basic-xxs): $6/month
# PostgreSQL (db-s-1vcpu-1gb): $15/month
# Redis (db-s-1vcpu-1gb): $15/month
# Total: $36/month
#
# With $200 credit: 5.5 months free
# After credit: Still cheaper than $950-$3,900/month SaaS alternatives
