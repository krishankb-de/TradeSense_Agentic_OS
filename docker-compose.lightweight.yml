# Lightweight Docker Compose for Resource-Constrained Systems
# Perfect for Lenovo SlimPad 5 with AMD Ryzen 7000
# Total RAM usage: ~2-3GB (vs 26GB+ for full local stack)

services:
  # ============================================================================
  # PostgreSQL (Lightweight configuration)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: tradesense-postgres-light
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradesense}
      POSTGRES_USER: ${POSTGRES_USER:-tradesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      # Optimize for low memory
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradesense}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tradesense-network

  # ============================================================================
  # Redis (Lightweight configuration)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tradesense-redis-light
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_password}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tradesense-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  tradesense-network:
    driver: bridge

# ============================================================================
# NOTES:
# ============================================================================
# This configuration runs ONLY essential services locally:
# - PostgreSQL (512MB RAM limit)
# - Redis (256MB RAM limit)
#
# Heavy services run in cloud (via Azure Student Pack):
# - LLM inference → Azure OpenAI
# - Voice processing → Azure Speech Services
# - Observability → Datadog
# - Production DB → Azure/DigitalOcean Managed
#
# Total local RAM usage: ~2-3GB (comfortable for your system)
# ============================================================================
